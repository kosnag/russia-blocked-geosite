name: build-custom-geosite

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: [ "main" ]
    paths-ignore: [ "**/README.md" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Checkout runetfreedom/russia-domains-list
        uses: actions/checkout@v4
        with:
          repository: runetfreedom/russia-domains-list
          path: additional

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./community/go.mod
          cache-dependency-path: ./community/go.sum

      - name: Build RU lists
        run: |
          curl -sSL "https://community.antifilter.download/list/domains.lst" > ./community/data/antifilter-download-community
          curl -sSL "https://raw.githubusercontent.com/1andrevich/Re-filter-lists/refs/heads/main/domains_all.lst" > ./community/data/refilter
          printf 'include:antifilter-download-community\ninclude:refilter\n' > ./community/data/ru-blocked
          rm -f ./additional/README.md
          cp ./additional/ru-available-only-inside ./community/data/

      - name: Build ad list
        run: |
          curl -sSL "https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt" | perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' > temp-reject.txt
          curl -sSL "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=hosts&showintro=1&mimetype=plaintext" | perl -ne '/^127\.0\.0\.1\s([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})$/ && print "$1\n"' >> temp-reject.txt
          sed -i '/t\.co/d' temp-reject.txt
          sort --ignore-case -u temp-reject.txt > ./community/data/category-ads-all

      - name: Build custom dat
        run: |
          mkdir -p ./publish
          cd ./community
          go run ./ --datapath=./data --datprofile=../profile.json --outputdir=../publish

      - name: Build custom geoip
        run: |
          curl -sSL "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/geoip-ru-only.dat" -o geoip-ru.dat
          curl -sSL "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/geoip-asn.dat" -o geoip-asn.dat
          cat ./geoip-ru.dat ./geoip-asn.dat > ./publish/geoip-direct.dat

      - name: Build mihomo rule sets
        run: |
          mkdir -p ./publish/ruleset
          python3 - <<'PY'
          domains = set()
          for p in ["community/data/antifilter-download-community", "community/data/refilter"]:
              with open(p, encoding="utf-8", errors="ignore") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      line = line.split("@")[0].strip()
                      for pref in ("domain:", "full:", "keyword:", "regexp:"):
                          if line.startswith(pref):
                              line = line[len(pref):].strip()
                              break
                      if not line:
                          continue
                      domains.add(line.lower())
          with open("publish/ruleset/ru-blocked-domain.yaml", "w", encoding="utf-8") as f:
              f.write("payload:\n")
              for d in sorted(domains):
                  f.write("  - '+.%s'\n" % d)
          print("domain rules:", len(domains))
          PY
          for name in ru-blocked ru-blocked-community; do
            curl -sSL "https://raw.githubusercontent.com/runetfreedom/russia-blocked-geoip/release/text/$name.txt" -o "/tmp/$name.txt"
            echo "payload:" > "./publish/ruleset/$name-ip.yaml"
            grep -E '^[0-9a-fA-F:.]+/[0-9]{1,3}$' "/tmp/$name.txt" | sed "s/^/  - '/; s/$/'/" >> "./publish/ruleset/$name-ip.yaml"
          done

      - name: Build sha256
        run: |
          cd ./publish
          sha256sum geosite-direct.dat > geosite-direct.dat.sha256
          sha256sum geoip-direct.dat > geoip-direct.dat.sha256

      - name: Push to release branch
        run: |
          cd ./publish
          git init -q
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b release
          git add -A
          git commit -q -m "Build $(date -u +%Y%m%d%H%M)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f -u origin release
